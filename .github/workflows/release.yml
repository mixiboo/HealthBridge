name: Release APK

# main에 올라온 versionName(app/build.gradle.kts)에 해당하는 릴리스가 없으면
# 테스트 → 서명된 APK 빌드 → 태그 vX.Y.Z와 GitHub 릴리스를 만든다.
# 앱은 이 릴리스를 보고 새 버전을 알려준다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "v$V 릴리스가 이미 있어요. 건너뜀."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.v.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK 36 (runner에 이미 있는 Android SDK 사용)
        if: steps.v.outputs.exists == 'false'
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - name: Decode keystore
        if: steps.v.outputs.exists == 'false'
        run: echo "${{ secrets.HB_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build
        if: steps.v.outputs.exists == 'false'
        env:
          HB_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          HB_KEYSTORE_PASSWORD: ${{ secrets.HB_KEYSTORE_PASSWORD }}
          HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
          HB_KEY_PASSWORD: ${{ secrets.HB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "healthbridge-${{ steps.v.outputs.tag }}.apk"
      - name: Publish release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" "healthbridge-$TAG.apk" --target "$GITHUB_SHA" \
            --title "헬스 브릿지 ${TAG#v}" --notes-file release-notes.md
